<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾原黑龙 · 动作预览 — 猫骑士屠龙</title>
<style>
  html,body{margin:0;height:100%;background:#595e63;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:14px 12px 18px;background:linear-gradient(transparent,rgba(10,10,12,.55));text-align:center}
  h1{position:fixed;top:14px;left:0;right:0;margin:0;text-align:center;color:#f3e9d2;font-size:20px;letter-spacing:.35em;text-shadow:0 2px 10px rgba(0,0,0,.5);font-weight:600}
  h1 small{display:block;margin-top:6px;font-size:11px;letter-spacing:.5em;color:#cfc7ae}
  .row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:860px;margin:0 auto}
  button{appearance:none;border:1px solid rgba(255,215,140,.45);background:rgba(20,18,14,.72);color:#f0e3c2;
    padding:10px 18px;border-radius:999px;font-size:15px;letter-spacing:.12em;cursor:pointer;transition:all .15s}
  button:hover{background:rgba(84,52,16,.85);transform:translateY(-1px)}
  button.on{background:#b3541e;border-color:#ffb03a;color:#fff;box-shadow:0 0 18px rgba(255,122,26,.45)}
  #hint{margin-top:10px;color:#d8d2c0;font-size:12px;letter-spacing:.2em;opacity:.85}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f3e9d2;font-size:16px;letter-spacing:.3em;background:#595e63;z-index:5}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<h1>雾 原 黑 龙 · 动 作 预 览<small>KITTEN KNIGHT · DRAGON ACTIONS</small></h1>
<div id="loading">黑 龙 苏 醒 中 …</div>
<div id="ui">
  <div class="row" id="btns"></div>
  <div id="hint">点按钮看动作 · 拖动旋转 · 滚轮缩放</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DRAGON_B64 = '%%DRAGON_B64%%';
const CLIPS = [
  ['idle',   '待机'],
  ['flap',   '扇翼飞行'],
  ['breath', '火焰吐息'],
  ['bite',   '撕咬'],
  ['claw',   '爪击'],
  ['sweep',  '尾扫'],
  ['roar',   '咆哮'],
  ['hurt',   '受击'],
  ['death',  '死亡倒地'],
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x767b80);
scene.fog = new THREE.Fog(0x767b80, 9, 26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 100);
camera.position.set(1.25, .72, 1.65);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .25, -0.02);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = .7;
controls.minDistance = .5; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * .55;
addEventListener('pointerdown', () => { controls.autoRotate = false; }, { once: true });

const key = new THREE.DirectionalLight(0xfff2dd, 2.4);
key.position.set(3, 6, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2; key.shadow.camera.right = 2; key.shadow.camera.top = 2; key.shadow.camera.bottom = -2;
scene.add(key);
scene.add(new THREE.AmbientLight(0xdfe8ff, .35));
const rim = new THREE.DirectionalLight(0xffa050, .8); rim.position.set(-4, 3, -5); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({ color: 0x707a68, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

let mixer = null, acts = {}, cur = '';
function play(name){
  const a = acts[name]; if(!a || !mixer) return;
  const prev = acts[cur];
  a.enabled = true;
  if(name === 'death'){ a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; a.reset(); }
  else { a.setLoop(THREE.LoopRepeat); a.clampWhenFinished = false; if(cur !== name) a.reset(); }
  a.fadeIn(.18).play();
  if(prev && prev !== a) prev.fadeOut(.18);
  cur = name;
  document.querySelectorAll('#btns button').forEach(b => b.classList.toggle('on', b.dataset.clip === name));
}
window.__play = play;
window.__cur = () => cur;
window.__actTime = () => (acts[cur] ? +acts[cur].time.toFixed(2) : -1);

const btns = document.getElementById('btns');
for(const [name, label] of CLIPS){
  const b = document.createElement('button');
  b.textContent = label; b.dataset.clip = name;
  b.addEventListener('click', () => play(name));
  btns.appendChild(b);
}

const blobUrl = URL.createObjectURL(new Blob([Uint8Array.from(atob(DRAGON_B64), c => c.charCodeAt(0))], { type: 'model/gltf-binary' }));
new GLTFLoader().load(blobUrl, (gltf) => {
  const m = gltf.scene;
  m.traverse(o => { if(o.isMesh){ o.castShadow = true; const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(mm => { if(mm && mm.isMeshStandardMaterial) mm.envMapIntensity = .55; }); } });
  scene.add(m);
  mixer = new THREE.AnimationMixer(m);
  gltf.animations.forEach(c => { acts[c.name] = mixer.clipAction(c); });
  document.getElementById('loading').style.display = 'none';
  play('idle');
  window.__ready = true;
}, undefined, (e) => { document.getElementById('loading').textContent = '模型加载失败：' + e; });

const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if(mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
})();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
